plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(platform('org.junit:junit-bom:5.10.1'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

application {
    mainClass = 'net.ddns.spellbank.harness.Runner'
}

sourceSets {
    jmh {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('jmh', JavaExec) {
    group = 'benchmark'
    description = 'Benchmarks a day with JMH: -Pday=XX [-Ppart=1|2].'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)

    args 'net.ddns.spellbank.harness.SolutionBenchmark', '-foe', 'true'
    args '-p', "day=${providers.gradleProperty('day').getOrElse('1')}"
    args '-p', "part=${providers.gradleProperty('part').getOrElse('1,2')}"
    args '-p', "resource=${providers.gradleProperty('resource').getOrElse('input1')}"

    if (providers.gradleProperty('input').isPresent()) {
        if (providers.gradleProperty('resource').isPresent()) {
            throw new GradleException('Choose either -Pinput or -Presource, not both.')
        }

        args '-p', "inputFile=${file(providers.gradleProperty('input').get()).absolutePath}"
    }

    // Optional overrides for shorter or longer benchmark runs.
    ['warmup': '-wi', 'iterations': '-i', 'forks': '-f', 'time': '-r'].each { property, flag ->
        if (providers.gradleProperty(property).isPresent()) {
            args flag, providers.gradleProperty(property).get()
        }
    }
    if (providers.gradleProperty('time').isPresent()) {
        args '-w', providers.gradleProperty('time').get()
    }
}

def year = "2023"

task initSource(type : Copy) {
    onlyIf {
        project.hasProperty('d')
    }
    doFirst {
        println "initSource ${project.findProperty('d')}"
    }

    from 'templates'
    include 'Day.template'
    into "src/main/java/net/ddns/spellbank/day${project.findProperty('d')}"
    rename(fileName -> "Day${project.findProperty('d')}.java")
    expand([day: project.findProperty('d')])
}

task initTest(type : Copy) {
    onlyIf {
        project.hasProperty('d')
    }
    doFirst {
        println "initTest ${project.findProperty('d')}"
    }
    from 'templates'
    include 'DayTest.template'
    into "src/test/java/net/ddns/spellbank/day${project.findProperty('d')}"
    rename(fileName -> "TestDay${project.findProperty('d')}.java")
    expand([day: project.findProperty('d')])
}

task initSourceInput(type : Copy) {
    onlyIf {
        project.hasProperty('d')
    }

    from 'templates'
    include 'input1'
    into "src/main/resources/day${project.findProperty('d')}"
}

task initDay {
    dependsOn 'initSource'
    dependsOn 'initTest'
    dependsOn 'initSourceInput'
}

// Allow scaffolding/downloading and running in one invocation without rewriting sources on normal builds.
tasks.named('compileJava') {
    mustRunAfter 'initSource'
}

tasks.named('compileTestJava') {
    mustRunAfter 'initTest'
}

tasks.named('processResources') {
    mustRunAfter 'initSourceInput', 'getInput'
}

import java.nio.channels.Channels

task getInput {
    onlyIf {
        project.hasProperty('d')
    }
    doFirst {
        File c = new File("cookie.txt")
        String cookie = "session=${c.text}"
        URL website = URI.create("https://adventofcode.com/${year}/day/${project.findProperty('d') as int}/input").toURL();
        URLConnection conn = website.openConnection()
        conn.setRequestProperty("Cookie", cookie)
        conn.connect()
        var rbc = Channels.newChannel(conn.getInputStream())
        File f = new File("src/main/resources/day${project.findProperty('d')}")
        f.mkdirs()
        try (FileOutputStream fos = new FileOutputStream("src/main/resources/day${project.findProperty('d')}/input1")) {
            fos.getChannel().transferFrom(rbc, 0, Long.MAX_VALUE)
        }
    }
}
